name: Build BB10 Hub APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Zulu)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.3.3
          arguments: |
            assembleDebug
            -Dorg.gradle.jvmargs=-Xmx2048m
            -Dfile.encoding=UTF-8

      - name: List Build Outputs
        run: |
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs -name "*.apk" -type f

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: bb10-hub-lawnchair12-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Report
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Java Version: 17 (Zulu)" >> $GITHUB_STEP_SUMMARY
          echo "- Gradle Version: 7.3.3" >> $GITHUB_STEP_SUMMARY
          echo "- Target SDK: 33" >> $GITHUB_STEP_SUMMARY
          echo "- Package: app.lawnchair.debug" >> $GITHUB_STEP_SUMMARY
